name: Build Native Flutter Android APK

on:
  push:
    branches:
      - main
      - master
      - koushik
  workflow_dispatch:

jobs:
  build:
    name: Build Native Android Release APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v4

      - name: Setup Java 17 (Required for Android Gradle)
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'

      - name: Setup Flutter SDK
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          cache: true

      - name: Install Flutter Dependencies
        run: flutter pub get

      - name: Patch Missing Namespaces in Legacy Plugins for AGP 8+
        run: |
          python3 -c "
          import glob, os, xml.etree.ElementTree as ET
          for f in glob.glob(os.path.expanduser('~/.pub-cache/**/android/build.gradle'), recursive=True):
              try:
                  with open(f, 'r') as fp:
                      content = fp.read()
                  if 'android {' in content and 'namespace' not in content:
                      manifest_path = os.path.join(os.path.dirname(f), 'src/main/AndroidManifest.xml')
                      pkg = None
                      if os.path.exists(manifest_path):
                          try:
                              tree = ET.parse(manifest_path)
                              pkg = tree.getroot().attrib.get('package')
                          except Exception:
                              pass
                      if not pkg:
                          if 'on_audio_query' in f:
                              pkg = 'com.lucasjosino.on_audio_query'
                          else:
                              pkg = 'com.plugin.legacy'
                      content = content.replace('android {', f'android {{\n    namespace \"{pkg}\"')
                      with open(f, 'w') as fp:
                          fp.write(content)
                      print(f'Patched namespace \"{pkg}\" in: {f}')
              except Exception as e:
                  print(f'Notice on {f}: {e}')
          "

      - name: Build Android APK
        run: flutter build apk --debug --android-skip-build-dependency-validation

      - name: Upload Native Android APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: kiwi-music-android-apk
          path: build/app/outputs/flutter-apk/app-debug.apk
          retention-days: 7
